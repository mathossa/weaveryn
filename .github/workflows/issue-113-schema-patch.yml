name: Apply issue 113 schema patch

on:
  push:
    branches:
      - feat/issue-113-world-events-timeline

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/issue-113-world-events-timeline

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Patch Prisma schema and migration
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('prisma/schema.prisma')
          text = path.read_text()

          text = text.replace(
              '''enum MembershipInvitationKind {\n  WORLD\n  CAMPAIGN\n}\n''',
              '''enum MembershipInvitationKind {\n  WORLD\n  CAMPAIGN\n}\n\nenum ReckoningDirection {\n  BEFORE\n  AFTER\n}\n'''
          )

          text = text.replace(
              '''  timelines            WorldTimeline[]\n  campaigns            Campaign[]\n''',
              '''  timelines            WorldTimeline[]\n  reckonings           WorldReckoning[]\n  campaigns            Campaign[]\n'''
          )

          text = text.replace(
              '''  sourceRelationships EntityRelationship[] @relation("EntityRelationshipSource")\n  targetRelationships EntityRelationship[] @relation("EntityRelationshipTarget")\n''',
              '''  sourceRelationships EntityRelationship[] @relation("EntityRelationshipSource")\n  targetRelationships EntityRelationship[] @relation("EntityRelationshipTarget")\n  worldEventLinks      WorldEventEntity[]\n'''
          )

          text = text.replace(
              '''  campaigns Campaign[]\n\n  createdAt DateTime @default(now())\n''',
              '''  campaigns Campaign[]\n  events    WorldEvent[]\n\n  createdAt DateTime @default(now())\n'''
          )

          marker = '''model WorldMembership {\n'''
          models = '''model WorldReckoning {\n  id                   String  @id @default(uuid()) @db.Uuid\n  worldId              String  @db.Uuid\n  name                 String\n  anchorWorldPosition  Decimal @db.Decimal(65, 30)\n  anchorWorldDateLabel String\n  beforeLabel          String\n  beforeAbbreviation   String?\n  afterLabel           String\n  afterAbbreviation    String?\n\n  world       World        @relation(fields: [worldId], references: [id], onDelete: Cascade)\n  startEvents WorldEvent[] @relation("WorldEventStartReckoning")\n  endEvents   WorldEvent[] @relation("WorldEventEndReckoning")\n\n  createdAt DateTime @default(now())\n  updatedAt DateTime @updatedAt\n\n  @@unique([worldId, name])\n  @@index([worldId, anchorWorldPosition])\n}\n\nmodel WorldEvent {\n  id                       String              @id @default(uuid()) @db.Uuid\n  timelineId               String              @db.Uuid\n  title                    String\n  description              String?\n  startWorldPosition       Decimal             @db.Decimal(65, 30)\n  endWorldPosition         Decimal?            @db.Decimal(65, 30)\n  startWorldDateLabel      String\n  endWorldDateLabel        String?\n  startReckoningId         String?             @db.Uuid\n  startReckoningDirection  ReckoningDirection?\n  endReckoningId           String?             @db.Uuid\n  endReckoningDirection    ReckoningDirection?\n  type                     String              @default("event")\n  data                     Json                @default("{}")\n\n  timeline       WorldTimeline    @relation(fields: [timelineId], references: [id], onDelete: Cascade)\n  startReckoning WorldReckoning? @relation("WorldEventStartReckoning", fields: [startReckoningId], references: [id], onDelete: Restrict)\n  endReckoning   WorldReckoning? @relation("WorldEventEndReckoning", fields: [endReckoningId], references: [id], onDelete: Restrict)\n  entities       WorldEventEntity[]\n\n  createdAt DateTime @default(now())\n  updatedAt DateTime @updatedAt\n\n  @@index([timelineId, startWorldPosition])\n  @@index([startReckoningId])\n  @@index([endReckoningId])\n}\n\nmodel WorldEventEntity {\n  worldEventId String @db.Uuid\n  worldEntityId String @db.Uuid\n  role          String?\n\n  worldEvent  WorldEvent  @relation(fields: [worldEventId], references: [id], onDelete: Cascade)\n  worldEntity WorldEntity @relation(fields: [worldEntityId], references: [id], onDelete: Cascade)\n\n  @@id([worldEventId, worldEntityId])\n  @@index([worldEntityId])\n}\n\n'''
          if marker not in text:
              raise SystemExit('WorldMembership insertion marker missing')
          text = text.replace(marker, models + marker, 1)
          path.write_text(text)

          migration = Path('prisma/migrations/20260821020000_world_events_and_reckonings')
          migration.mkdir(parents=True, exist_ok=True)
          migration.joinpath('migration.sql').write_text('''-- CreateEnum\nCREATE TYPE "ReckoningDirection" AS ENUM ('BEFORE', 'AFTER');\n\n-- CreateTable\nCREATE TABLE "WorldReckoning" (\n    "id" UUID NOT NULL,\n    "worldId" UUID NOT NULL,\n    "name" TEXT NOT NULL,\n    "anchorWorldPosition" DECIMAL(65,30) NOT NULL,\n    "anchorWorldDateLabel" TEXT NOT NULL,\n    "beforeLabel" TEXT NOT NULL,\n    "beforeAbbreviation" TEXT,\n    "afterLabel" TEXT NOT NULL,\n    "afterAbbreviation" TEXT,\n    "createdAt" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,\n    "updatedAt" TIMESTAMP(3) NOT NULL,\n\n    CONSTRAINT "WorldReckoning_pkey" PRIMARY KEY ("id")\n);\n\n-- CreateTable\nCREATE TABLE "WorldEvent" (\n    "id" UUID NOT NULL,\n    "timelineId" UUID NOT NULL,\n    "title" TEXT NOT NULL,\n    "description" TEXT,\n    "startWorldPosition" DECIMAL(65,30) NOT NULL,\n    "endWorldPosition" DECIMAL(65,30),\n    "startWorldDateLabel" TEXT NOT NULL,\n    "endWorldDateLabel" TEXT,\n    "startReckoningId" UUID,\n    "startReckoningDirection" "ReckoningDirection",\n    "endReckoningId" UUID,\n    "endReckoningDirection" "ReckoningDirection",\n    "type" TEXT NOT NULL DEFAULT 'event',\n    "data" JSONB NOT NULL DEFAULT '{}',\n    "createdAt" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,\n    "updatedAt" TIMESTAMP(3) NOT NULL,\n\n    CONSTRAINT "WorldEvent_pkey" PRIMARY KEY ("id"),\n    CONSTRAINT "WorldEvent_end_not_before_start_check" CHECK ("endWorldPosition" IS NULL OR "endWorldPosition" >= "startWorldPosition"),\n    CONSTRAINT "WorldEvent_start_reckoning_pair_check" CHECK (("startReckoningId" IS NULL) = ("startReckoningDirection" IS NULL)),\n    CONSTRAINT "WorldEvent_end_reckoning_pair_check" CHECK (("endReckoningId" IS NULL) = ("endReckoningDirection" IS NULL)),\n    CONSTRAINT "WorldEvent_end_date_pair_check" CHECK (("endWorldPosition" IS NULL AND "endWorldDateLabel" IS NULL AND "endReckoningId" IS NULL AND "endReckoningDirection" IS NULL) OR ("endWorldPosition" IS NOT NULL AND "endWorldDateLabel" IS NOT NULL))\n);\n\n-- CreateTable\nCREATE TABLE "WorldEventEntity" (\n    "worldEventId" UUID NOT NULL,\n    "worldEntityId" UUID NOT NULL,\n    "role" TEXT,\n\n    CONSTRAINT "WorldEventEntity_pkey" PRIMARY KEY ("worldEventId", "worldEntityId")\n);\n\n-- CreateIndex\nCREATE UNIQUE INDEX "WorldReckoning_worldId_name_key" ON "WorldReckoning"("worldId", "name");\nCREATE INDEX "WorldReckoning_worldId_anchorWorldPosition_idx" ON "WorldReckoning"("worldId", "anchorWorldPosition");\nCREATE INDEX "WorldEvent_timelineId_startWorldPosition_idx" ON "WorldEvent"("timelineId", "startWorldPosition");\nCREATE INDEX "WorldEvent_startReckoningId_idx" ON "WorldEvent"("startReckoningId");\nCREATE INDEX "WorldEvent_endReckoningId_idx" ON "WorldEvent"("endReckoningId");\nCREATE INDEX "WorldEventEntity_worldEntityId_idx" ON "WorldEventEntity"("worldEntityId");\n\n-- AddForeignKey\nALTER TABLE "WorldReckoning" ADD CONSTRAINT "WorldReckoning_worldId_fkey" FOREIGN KEY ("worldId") REFERENCES "World"("id") ON DELETE CASCADE ON UPDATE CASCADE;\nALTER TABLE "WorldEvent" ADD CONSTRAINT "WorldEvent_timelineId_fkey" FOREIGN KEY ("timelineId") REFERENCES "WorldTimeline"("id") ON DELETE CASCADE ON UPDATE CASCADE;\nALTER TABLE "WorldEvent" ADD CONSTRAINT "WorldEvent_startReckoningId_fkey" FOREIGN KEY ("startReckoningId") REFERENCES "WorldReckoning"("id") ON DELETE RESTRICT ON UPDATE CASCADE;\nALTER TABLE "WorldEvent" ADD CONSTRAINT "WorldEvent_endReckoningId_fkey" FOREIGN KEY ("endReckoningId") REFERENCES "WorldReckoning"("id") ON DELETE RESTRICT ON UPDATE CASCADE;\nALTER TABLE "WorldEventEntity" ADD CONSTRAINT "WorldEventEntity_worldEventId_fkey" FOREIGN KEY ("worldEventId") REFERENCES "WorldEvent"("id") ON DELETE CASCADE ON UPDATE CASCADE;\nALTER TABLE "WorldEventEntity" ADD CONSTRAINT "WorldEventEntity_worldEntityId_fkey" FOREIGN KEY ("worldEntityId") REFERENCES "WorldEntity"("id") ON DELETE CASCADE ON UPDATE CASCADE;\n''')
          PY

      - name: Format Prisma schema
        run: npx prisma format

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/issue-113-schema-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma prisma/migrations/20260821020000_world_events_and_reckonings/migration.sql .github/workflows/issue-113-schema-patch.yml
          git commit -m "feat: add World event and reckoning schema"
          git push origin HEAD:feat/issue-113-world-events-timeline
