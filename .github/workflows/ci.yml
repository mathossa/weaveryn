name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: weaveryn
          POSTGRES_PASSWORD: unused
          POSTGRES_DB: weaveryn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U weaveryn -d weaveryn_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://weaveryn:unused@127.0.0.1:5432/weaveryn_test
      DEV_DATABASE_NAME: weaveryn_test
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-change-me-1234567890
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Preview deployment formatting
        run: |
          npx prettier compose.production.yml docs/SELF_HOSTING.md --write
          git diff -- compose.production.yml docs/SELF_HOSTING.md

      - name: Validate repository
        run: npm run validate

      - name: Run authentication integration test
        run: npm run test:integration

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROXY_NETWORK: weaveryn-proxy
      POSTGRES_DB: weaveryn
      POSTGRES_USER: weaveryn
      POSTGRES_PASSWORD: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-change-me-1234567890
      BETTER_AUTH_URL: https://weaveryn.example.invalid
      BETTER_AUTH_TRUSTED_ORIGINS: https://weaveryn.example.invalid
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate production Compose configuration
        run: docker compose -f compose.production.yml config

      - name: Build production container
        run: docker build --tag weaveryn:ci .
