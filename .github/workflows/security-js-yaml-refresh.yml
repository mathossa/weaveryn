name: Temporary js-yaml security refresh

on:
  push:
    branches:
      - security/issue-180-js-yaml
    paths:
      - .github/workflows/security-js-yaml-refresh.yml
      - package-lock.json

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security/issue-180-js-yaml

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
          cache: npm

      - name: Patch audit-fixable lockfile vulnerabilities
        run: npm audit fix --package-lock-only --ignore-scripts

      - name: Verify high-severity audit gate
        run: npm audit --audit-level=high

      - name: Commit refreshed lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already secure"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Patch js-yaml transitive dependency"
          git push origin HEAD:security/issue-180-js-yaml
