name: Update chronology architecture docs

on:
  push:
    branches:
      - feat/issue-113-world-events-timeline

permissions:
  contents: write

jobs:
  update-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/issue-113-world-events-timeline

      - name: Update architecture
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('docs/ARCHITECTURE.md')
          text = path.read_text()

          def replace(old: str, new: str):
              global text
              if old not in text:
                  raise SystemExit(f'Expected architecture block not found: {old[:120]!r}')
              text = text.replace(old, new, 1)

          replace(
              "Temporal facts about a WorldEntity must not be modeled as though the entity has one universally current state. Facts that change according to in-world time, such as the destruction of a settlement, the death of a ruler, or a change of ownership, belong to World history.\n\nCampaigns operate within a temporal context of their World and resolve World entities according to their position on the relevant World timeline.\n",
              "Temporal facts about a WorldEntity must not be modeled as though the entity has one universally current state. Facts that change according to in-world time, such as the destruction of a settlement, the death of a ruler, or a change of ownership, belong to World history.\n\nWorld history uses a canonical sortable World position that is deliberately separate from the date notation shown to users. `WorldEvent` may represent either a point in time or a duration with a start and optional end position. Normal event authoring goes through the World Date Resolver rather than asking users to type the internal chronology coordinate.\n\nThe MVP resolver supports a simple World year plus optional named reckonings anchored to canonical positions. Reckonings are not a hard-coded BC/AD enum and may overlap: one canonical moment can legitimately be expressed relative to several historical anchors. The event can retain the reckoning notation chosen by its author while canonical positions remain authoritative for sorting and later state resolution.\n\nCalendar structure is a separate concern. Months, weeks, weekdays, day/hour lengths, seasons, leap or intercalary rules, moons, solar cycles, and richer date formatting are part of the calendar system tracked by #69. That system extends the same World Date Resolver and must not require replacing WorldEvent identity or duplicating derived calendar facts into every event.\n\nCampaigns operate within a temporal context of their World and resolve World entities according to their position on the relevant World timeline.\n",
          )

          replace(
              "The first MVP supports one automatically created main timeline per World. Timeline events use both a sortable numeric position and a human-readable date label. The sortable position is authoritative for ordering and state resolution; the label permits setting-specific notation without treating every World as a Gregorian calendar.\n",
              "The first MVP supports one automatically created main timeline per World. Timeline events store authoritative canonical start positions and optional end positions for durations, together with human-readable setting-specific date labels. Users normally author dates through the World Date Resolver; the raw canonical coordinate is an implementation detail rather than a normal form field. Named reckonings may project different labels onto the same canonical moment without changing event ordering.\n",
          )

          replace(
              "### Initial World Permissions\n\n- The World owner controls World lifecycle, ownership, members, configuration, World content, and Campaign placement.\n- `ADMIN` may manage World members, normal World content, and Campaign creation, but may not transfer or relinquish ownership or delete the World.\n- `MEMBER` may read the World and create or edit normal WorldEntity content, but may not manage ownership, lifecycle, or membership.\n- `VIEWER` has read-only access to World content visible to them.\n",
              "### Initial World Permissions\n\n- The World owner controls World lifecycle, ownership, members, configuration, World content, canonical history, chronology configuration, and Campaign placement.\n- `ADMIN` may manage World members, World configuration (including named chronology reckonings), normal World content and canonical history, and Campaign creation, but may not transfer or relinquish ownership or delete the World.\n- `MEMBER` (Threadwalker) may read the World and create or edit normal World content, including WorldEntity content and canonical World events, but may not manage chronology configuration, ownership, lifecycle, or membership.\n- `VIEWER` (Threadwatcher) has read-only access to World content visible to them, including canonical history, and cannot author events or configure chronology.\n- Campaign-only access does not grant unrestricted access to the canonical World timeline.\n",
          )

          replace(
              "25. MVP timeline ordering uses an authoritative numeric position plus a human-readable date label.\n",
              "25. MVP timeline ordering uses authoritative canonical World positions; human-facing date notation is resolved separately and normal authoring does not depend on entering raw numeric positions.\n",
          )

          path.write_text(text)
          PY

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/update-chronology-architecture.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ARCHITECTURE.md .github/workflows/update-chronology-architecture.yml
          git commit -m "docs: align World chronology architecture"
          git push origin HEAD:feat/issue-113-world-events-timeline
