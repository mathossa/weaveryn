name: Format Threadwalker campaign creation

on:
  push:
    branches:
      - feat/issue-53-threadwalker-campaign-creation

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/issue-53-threadwalker-campaign-creation

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format changed files
        run: >-
          npx prettier
          src/app/dev/campaign-foundation/campaign-foundation-lab.tsx
          src/server/dev-scenarios/campaign-foundation.ts
          --write

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/format-threadwalker-campaign.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/dev/campaign-foundation/campaign-foundation-lab.tsx src/server/dev-scenarios/campaign-foundation.ts .github/workflows/format-threadwalker-campaign.yml
          git commit -m "style: format Threadwalker campaign changes"
          git push origin HEAD:feat/issue-53-threadwalker-campaign-creation
