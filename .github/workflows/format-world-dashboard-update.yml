name: Format world dashboard update

on:
  push:
    branches:
      - feat/world-overview-dashboard

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/world-overview-dashboard

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format dashboard files
        run: >-
          npx prettier
          src/app/world/[worldId]/page.tsx
          src/app/world/world-dashboard.module.css
          --write

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/world/[worldId]/page.tsx src/app/world/world-dashboard.module.css
          git commit -m "style: format world dashboard update"
          git push origin HEAD:feat/world-overview-dashboard
