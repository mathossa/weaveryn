name: Issue 114 artwork generation

on:
  push:
    branches:
      - codex/issue-114-default-entity-artwork
    paths:
      - scripts/generate-issue-114-artwork.py

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/issue-114-default-entity-artwork

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Generate and optimize artwork
        run: python scripts/generate-issue-114-artwork.py

      - name: Validate generated assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          expected = {
              'public/images/entities/person.webp': (1536, 1024),
              'public/images/entities/location.webp': (1536, 1024),
              'public/images/entities/organization.webp': (1536, 1024),
              'public/images/entities/item.webp': (1536, 1024),
              'public/images/entities/event.webp': (1536, 1024),
              'public/images/entities/deity.webp': (1536, 1024),
              'public/images/entities/creature.webp': (1536, 1024),
              'public/images/entities/quest.webp': (1536, 1024),
              'public/images/entities/generic.webp': (1536, 1024),
              'public/images/backgrounds/entity-banner.webp': (2160, 720),
          }
          for name, dimensions in expected.items():
              path = Path(name)
              if not path.exists():
                  raise SystemExit(f'missing {name}')
              with Image.open(path) as image:
                  if image.size != dimensions or image.format != 'WEBP':
                      raise SystemExit(
                          f'{name}: expected WEBP {dimensions}, got {image.format} {image.size}'
                      )
                  if image.info.get('exif') or image.info.get('icc_profile'):
                      raise SystemExit(f'{name}: metadata was not stripped')
              if path.stat().st_size > 250_000:
                  raise SystemExit(f'{name}: exceeds 250 KB hard maximum')
              print(f'{name}: {dimensions[0]}x{dimensions[1]}, {path.stat().st_size / 1000:.1f} KB')
          PY

      - name: Commit generated production assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/images/entities/*.webp public/images/backgrounds/entity-banner.webp
          git diff --cached --quiet && exit 0
          git commit -m 'feat: add generated World entity artwork [skip ci]'
          git push origin HEAD:codex/issue-114-default-entity-artwork
