name: Temporary lockfile sync

on:
  push:
    branches:
      - security/pre-mvp-dependency-audit

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out audit branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security/pre-mvp-dependency-audit

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.12.0
          cache: npm

      - name: Regenerate lockfile from package overrides
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit synchronized lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Synchronize patched dependency lockfile"
          git push origin HEAD:security/pre-mvp-dependency-audit
