name: Format issue 113 changes

on:
  push:
    branches:
      - feat/issue-113-world-events-timeline

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/issue-113-world-events-timeline

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format issue files
        run: >-
          npx prettier
          src/app/api/v1/worlds/[worldId]/events/[eventId]/route.ts
          src/app/world/[worldId]/timeline/world-timeline-view.tsx
          src/app/world/[worldId]/timeline/timeline.module.css
          src/app/world/[worldId]/timeline/loading.tsx
          src/app/world/[worldId]/timeline/error.tsx
          src/app/world/[worldId]/timeline/timeline-error.module.css
          src/dev/scenarios/world-events.ts
          src/server/world-events/*.ts
          --write

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/format-issue-113.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/v1/worlds/[worldId]/events/[eventId]/route.ts src/app/world/[worldId]/timeline src/dev/scenarios/world-events.ts src/server/world-events .github/workflows/format-issue-113.yml
          git commit -m "style: format World timeline changes"
          git push origin HEAD:feat/issue-113-world-events-timeline
