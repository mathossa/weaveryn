name: Temporary security lock refresh

on:
  push:
    branches:
      - security/issue-178-next-vitest-advisories
    paths:
      - package.json
      - .github/workflows/security-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security/issue-178-next-vitest-advisories

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.12.0
          cache: npm

      - name: Refresh package lock only
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit refreshed lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already matches package.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh lockfile for patched dependencies"
          git push origin HEAD:security/issue-178-next-vitest-advisories
