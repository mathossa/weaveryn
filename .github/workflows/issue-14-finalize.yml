name: Issue 14 finalize

on:
  push:
    branches:
      - feat/issue-14-auth-account-lifecycle

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://weaveryn:unused@127.0.0.1:5432/weaveryn_test
      DEV_DATABASE_NAME: weaveryn_test
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-change-me-1234567890
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Generate dependency lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Update authentication documentation
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'docs/ARCHITECTURE.md': [(
                  "The first MVP uses local email-and-password authentication with server-enforced sessions. Passwords must only be stored as strong password hashes and never as plaintext. Social login, Apple/Google login, and password-recovery email flows are outside the first MVP.",
                  "The first MVP uses Better Auth with local email-and-password authentication and database-backed server sessions. Better Auth reuses the existing Weaveryn `User` row as its user identity, so the stable `User.id` referenced by World, Campaign, and Character services is also the authenticated identity. Credential password hashes live only in Better Auth `Account` records; plaintext passwords are never persisted. Better Auth `Session` records live in shared PostgreSQL persistence, and the HTTP boundary resolves the authenticated Weaveryn User from the framework-managed session before invoking domain services. Social login, Apple/Google login, email verification, and password-recovery email flows are outside the first MVP."
              )],
              'docs/DATA_MODEL.md': [
                  ('- passwordHash', '- emailVerified'),
                  ('- avatar', '- image'),
                  (
                      "For the first MVP, a User authenticates locally with email and password. `passwordHash` contains only a strong password hash. Social-provider identities and password-recovery tokens are post-MVP concerns.",
                      "For the first MVP, a User authenticates locally with email and password through Better Auth. The existing `User.id` is the authoritative Weaveryn identity used by World, Campaign, and Character relations. Credential hashes are stored in Better Auth `Account` records and never on the domain `User` row; server sessions are stored in Better Auth `Session` records. Social-provider identities, email verification flows, and password-recovery email are post-MVP concerns."
                  ),
              ],
              'docs/TECH_STACK.md': [(
                  """The first MVP supports local email-and-password accounts.

- passwords are processed with a dedicated password-hashing implementation and
  stored only as strong password hashes
- authentication establishes a server-enforced session
- session data is cryptographically self-contained or stored in shared
  persistence so multiple application workers can validate it
- protected REST endpoints resolve the authenticated User before invoking
  application services
- logout invalidates or expires the authenticated session

Google, Apple, other social identity providers, and email-based password
recovery are deferred. The authentication boundary should still remain modular
so providers can be added later without changing World, Campaign, or Character
domain services.""",
                  """The first MVP uses Better Auth for local email-and-password accounts. The project pins the current stable Better Auth release and uses its supported Prisma/PostgreSQL and Next.js integrations.

- the existing Weaveryn `User.id` remains the authoritative domain and authentication identity
- Better Auth stores credential password hashes in `Account` records; plaintext passwords are never persisted
- Better Auth stores server sessions in shared PostgreSQL `Session` records so application workers do not require sticky sessions
- the Next.js Better Auth handler owns generic sign-up, sign-in, session, and sign-out protocol concerns
- protected Weaveryn endpoints resolve the authenticated User at one canonical server boundary before invoking application services
- account deletion is a Weaveryn domain workflow and must not be replaced by a generic authentication-provider delete operation
- logout invalidates the framework-managed session

Google, Apple, other social identity providers, email verification, and email-based password recovery are deferred. The authentication boundary remains modular so providers can be added later without changing World, Campaign, or Character domain services."""
              )],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Expected authentication documentation text not found in {filename}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY

      - name: Format Issue 14 changes
        run: npm run format

      - name: Validate repository
        run: npm run validate

      - name: Create finalized commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-14-finalize.yml
          git add -A
          git commit -m "chore: finalize Better Auth integration"

      - name: Verify bundle
        run: |
          git bundle create weaveryn-better-auth.bundle "${GITHUB_REF_NAME}"
          git bundle verify weaveryn-better-auth.bundle

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: weaveryn-better-auth-bundle
          path: weaveryn-better-auth.bundle
          if-no-files-found: error
          retention-days: 7

      - name: Push finalized branch
        run: git push origin HEAD:"${GITHUB_REF_NAME}"
