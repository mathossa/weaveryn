name: Finish issue 113 integration

on:
  push:
    branches:
      - feat/issue-113-world-events-timeline

permissions:
  contents: write

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: weaveryn
          POSTGRES_PASSWORD: unused
          POSTGRES_DB: weaveryn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U weaveryn -d weaveryn_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://weaveryn:unused@127.0.0.1:5432/weaveryn_test
      DEV_DATABASE_NAME: weaveryn_test
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-change-me-1234567890
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/issue-113-world-events-timeline

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply issue 113 integration
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str):
              target = Path(path)
              text = target.read_text()
              if old not in text:
                  raise SystemExit(f"Expected block not found in {path}: {old[:100]!r}")
              target.write_text(text.replace(old, new, 1))

          # Open the ?new=1 editor through initial state instead of a state-setting effect.
          replace(
              'src/app/world/[worldId]/timeline/world-timeline-view.tsx',
              "import { FormEvent, useEffect, useMemo, useState } from 'react'\n",
              "import { FormEvent, useMemo, useState } from 'react'\n",
          )
          replace(
              'src/app/world/[worldId]/timeline/world-timeline-view.tsx',
              "  const [editor, setEditor] = useState<'create' | EventView | null>(null)\n  const [chronologyOpen, setChronologyOpen] = useState(false)\n  const [deleteBusy, setDeleteBusy] = useState(false)\n  const [detailError, setDetailError] = useState<string | null>(null)\n\n  useEffect(() => {\n    if (initialCreate && canEditEvents) setEditor('create')\n  }, [canEditEvents, initialCreate])\n",
              "  const [editor, setEditor] = useState<'create' | EventView | null>(() =>\n    initialCreate && canEditEvents ? 'create' : null,\n  )\n  const [chronologyOpen, setChronologyOpen] = useState(false)\n  const [deleteBusy, setDeleteBusy] = useState(false)\n  const [detailError, setDetailError] = useState<string | null>(null)\n",
          )

          # Register deterministic World-events scenario.
          replace(
              'src/dev/scenario-catalog.ts',
              "  {\n    id: 'world-update-example',",
              "  {\n    id: 'world-events',\n    title: 'World events and main timeline',\n    domain: 'Worlds',\n    purpose:\n      'Exercise point and duration World events, entity links, named reckonings, chronological ordering, invalid spans, and Threadwalker/Threadwatcher authorization through the real World event service.',\n    href: '/dev/world-events',\n    issueNumbers: [113, 69],\n    prerequisites: [\n      'Dedicated development database',\n      'Applied Prisma migrations',\n    ],\n    availability: 'available',\n    fixtureNamespace: 'dev:world-events:v1',\n  },\n  {\n    id: 'world-update-example',",
          )

          replace(
              'src/server/dev-scenarios/registry.ts',
              "import { worldEntitiesScenario } from './world-entities'\n",
              "import { worldEntitiesScenario } from './world-entities'\nimport { worldEventsScenario } from './world-events'\n",
          )
          replace(
              'src/server/dev-scenarios/registry.ts',
              "  [worldEntitiesScenario.metadata.id, worldEntitiesScenario],\n",
              "  [worldEntitiesScenario.metadata.id, worldEntitiesScenario],\n  [worldEventsScenario.metadata.id, worldEventsScenario],\n",
          )

          # World dashboard: expose the production history workspace only to full World access.
          replace(
              'src/app/world/[worldId]/page.tsx',
              "              <div\n                className={`${styles.actionItem} ${styles.actionDisabled}`}\n                aria-disabled=\"true\"\n              >\n                <span className={styles.actionIcon} aria-hidden=\"true\">\n                  ◇\n                </span>\n                <span>\n                  <strong>Open World map</strong>\n                  <small>Planned World map workspace</small>\n                </span>\n                <span className={styles.actionArrow}>Soon</span>\n              </div>\n",
              "              {world.hasFullWorldAccess ? (\n                <Link\n                  className={styles.actionItem}\n                  href={`/world/${world.id}/timeline`}\n                >\n                  <span className={styles.actionIcon} aria-hidden=\"true\">\n                    ⇄\n                  </span>\n                  <span>\n                    <strong>Open World timeline</strong>\n                    <small>Browse canonical history and eras</small>\n                  </span>\n                  <span className={styles.actionArrow} aria-hidden=\"true\">\n                    ›\n                  </span>\n                </Link>\n              ) : null}\n\n              <div\n                className={`${styles.actionItem} ${styles.actionDisabled}`}\n                aria-disabled=\"true\"\n              >\n                <span className={styles.actionIcon} aria-hidden=\"true\">\n                  ◇\n                </span>\n                <span>\n                  <strong>Open World map</strong>\n                  <small>Planned World map workspace</small>\n                </span>\n                <span className={styles.actionArrow}>Soon</span>\n              </div>\n",
          )
          replace(
              'src/app/world/[worldId]/page.tsx',
              "              <div\n                className={`${styles.overviewItem} ${styles.overviewDisabled}`}\n              >\n                <span className={styles.overviewIcon} aria-hidden=\"true\">\n                  ⇄\n                </span>\n                <span>\n                  <strong>Timeline</strong>\n                  <small>World history and eras.</small>\n                </span>\n                <span>Soon</span>\n              </div>\n",
              "              {world.hasFullWorldAccess ? (\n                <Link\n                  className={styles.overviewItem}\n                  href={`/world/${world.id}/timeline`}\n                >\n                  <span className={styles.overviewIcon} aria-hidden=\"true\">\n                    ⇄\n                  </span>\n                  <span>\n                    <strong>Timeline</strong>\n                    <small>World history, events, and year systems.</small>\n                  </span>\n                  <span aria-hidden=\"true\">›</span>\n                </Link>\n              ) : (\n                <div\n                  className={`${styles.overviewItem} ${styles.overviewDisabled}`}\n                  aria-disabled=\"true\"\n                >\n                  <span className={styles.overviewIcon} aria-hidden=\"true\">\n                    ⇄\n                  </span>\n                  <span>\n                    <strong>Timeline</strong>\n                    <small>Full World membership is required.</small>\n                  </span>\n                  <span>Restricted</span>\n                </div>\n              )}\n",
          )

          # Campaign dashboard: link World members to the same canonical timeline, while preserving campaign-only privacy.
          replace(
              'src/app/world/[worldId]/campaign/[campaignId]/page.tsx',
              "import { getCampaignOverview } from '@/server/campaigns'\n",
              "import { getCampaignOverview } from '@/server/campaigns'\nimport { getWorldOverview } from '@/server/worlds'\n",
          )
          replace(
              'src/app/world/[worldId]/campaign/[campaignId]/page.tsx',
              "  const [campaign, entryPreferences] = await Promise.all([\n    getCampaignOverview(worldId, campaignId, user.id),\n    listEntryPreferences(user.id),\n  ])\n",
              "  const [campaign, entryPreferences, worldOverview] = await Promise.all([\n    getCampaignOverview(worldId, campaignId, user.id),\n    listEntryPreferences(user.id),\n    getWorldOverview(worldId, user.id),\n  ])\n",
          )
          replace(
              'src/app/world/[worldId]/campaign/[campaignId]/page.tsx',
              "    {\n      label: 'Timeline',\n      icon: 'timeline',\n      href: placeholderHref('timeline'),\n    },\n",
              "    worldOverview?.hasFullWorldAccess\n      ? {\n          label: 'Timeline',\n          icon: 'timeline',\n          href: `/world/${worldId}/timeline`,\n          implemented: true,\n        }\n      : {\n          label: 'Timeline',\n          icon: 'timeline',\n          href: placeholderHref('timeline'),\n        },\n",
          )

          # Document the persisted chronology foundation and the calendar boundary.
          replace(
              'docs/ARCHITECTURE.md',
              "### Linked Entities and World History\n",
              "### Linked Entities and World History\n\nWorld history uses a canonical sortable World position that is intentionally separate from the date notation shown to users. Normal event authoring must use a World-date resolver rather than requiring users to type internal chronology coordinates.\n\nThe MVP resolver supports simple World years and multiple named reckonings anchored to canonical positions. Reckonings may overlap: the same canonical moment can be expressed relative to different anchors (for example `100 AC` and `100 BR`). World owner/administrators configure reckonings; World `MEMBER`s (Threadwalkers) may author events through normal World content permission; `VIEWER`s (Threadwatchers) remain read-only.\n\nCalendar structure remains a separate concern. Months, weekdays, day/hour lengths, leap/intercalary rules, seasons, moons, solar cycles, and richer date formatting belong to the configurable calendar system tracked by #69. That system expands the resolver boundary without changing WorldEvent identity or duplicating derived calendar facts into every event.\n\n",
          )

          replace(
              'docs/DATA_MODEL.md',
              "### 16.2 World Event\n\nA `WorldEvent` represents a time-dependent fact or change in World history.\n\n```text\nWorldEvent\n- id\n- timelineId\n- worldPosition\n- worldDateLabel\n- type\n- data\n- createdAt\n- updatedAt\n```\n",
              "### 16.2 World Event\n\nA `WorldEvent` represents a time-dependent fact or change in World history.\n\n```text\nWorldEvent\n- id\n- timelineId\n- title\n- description?\n- startWorldPosition\n- endWorldPosition?\n- startWorldDateLabel\n- endWorldDateLabel?\n- startReckoningId?\n- startReckoningDirection?\n- endReckoningId?\n- endReckoningDirection?\n- type\n- data\n- createdAt\n- updatedAt\n```\n",
          )
          replace(
              'docs/DATA_MODEL.md',
              "`worldPosition` is the authoritative sortable numeric value for ordering and state resolution. `worldDateLabel` is a human-readable, setting-specific label and is not assumed to use a Gregorian calendar.\n",
              "`startWorldPosition` is the authoritative sortable numeric value for ordering and state resolution. `endWorldPosition`, when present, makes the event a duration and must not precede the start. The date labels are human-readable, setting-specific representations and are not assumed to use a Gregorian calendar. Normal users do not enter canonical positions directly; a World-date resolver derives them from the chosen human-facing notation.\n\nA `WorldReckoning` defines an optional named year-numbering system anchored to a canonical World position. Each reckoning can expose before/after labels and abbreviations. Multiple reckonings may coexist and overlap, so they are not modeled as a single mandatory linear era sequence. Full calendar structure such as months, weekdays, hours, seasons, leap rules, moons, and solar cycles remains part of the later calendar system (#69) and should resolve through the same canonical position boundary.\n",
          )

          # Development route for deterministic World-event behavior.
          Path('src/app/dev/world-events').mkdir(parents=True, exist_ok=True)
          Path('src/app/dev/world-events/page.tsx').write_text("""import type { Metadata } from 'next'\nimport { notFound } from 'next/navigation'\nimport { WorldEventsLab } from './scenario-lab'\n\nexport const metadata: Metadata = {\n  title: 'World events scenario | Weaveryn',\n}\n\nexport default function WorldEventsPage() {\n  if (process.env.NODE_ENV === 'production') notFound()\n  return <WorldEventsLab />\n}\n""")
          Path('src/app/dev/world-events/scenario-lab.tsx').write_text("""'use client'\n\nimport { requireDevScenarioMetadata } from '@/dev/scenario-catalog'\nimport type {\n  WorldEventsAction,\n  WorldEventsActor,\n  WorldEventsState,\n} from '@/dev/scenarios/world-events'\nimport {\n  ScenarioLifecycleControls,\n  ScenarioNavigation,\n  ScenarioResultPanels,\n} from '../_components/scenario-ui'\nimport { useDevScenario } from '../_components/use-dev-scenario'\n\nconst metadata = requireDevScenarioMetadata('world-events')\n\nexport function WorldEventsLab() {\n  const { result, isBusy, perform } = useDevScenario<\n    WorldEventsState,\n    WorldEventsAction\n  >(metadata.id)\n  const state = result?.state\n\n  function act(action: WorldEventsAction['action'], actor: WorldEventsActor) {\n    if (action === 'create-invalid-duration') {\n      return perform({ action, actor: 'MEMBER' })\n    }\n    return perform({ action, actor })\n  }\n\n  return (\n    <main className=\"dev-page\">\n      <ScenarioNavigation issueNumbers={metadata.issueNumbers} />\n      <header>\n        <span>Development only · Issue #113</span>\n        <h1>World events and main timeline</h1>\n        <p>\n          Exercise canonical chronology, point and duration events, linked World\n          entities, named reckonings, invalid date ranges, and World-role\n          authorization through the production WorldEventService.\n        </p>\n      </header>\n\n      <ScenarioLifecycleControls\n        isBusy={isBusy}\n        hasFixture={Boolean(state)}\n        onAction={(action) => void perform({ action })}\n      />\n\n      <section>\n        <h2>Fixture state</h2>\n        {state ? (\n          <>\n            <p>\n              <strong>{state.world.name}</strong> · {state.timeline.name}\n            </p>\n            <p>\n              Linked entities: {state.entities.map((entity) => entity.name).join(', ')}\n            </p>\n            <h3>Reckonings</h3>\n            {state.reckonings.length ? (\n              <ul>\n                {state.reckonings.map((reckoning) => (\n                  <li key={reckoning.id}>\n                    <strong>{reckoning.name}</strong> · anchor {reckoning.anchorWorldDateLabel}\n                    {' · '}\n                    {reckoning.beforeAbbreviation ?? 'before'} / {reckoning.afterAbbreviation ?? 'after'}\n                  </li>\n                ))}\n              </ul>\n            ) : (\n              <p>No named year systems configured.</p>\n            )}\n            <h3>Events in canonical order</h3>\n            {state.events.length ? (\n              <ol>\n                {state.events.map((event) => (\n                  <li key={event.id}>\n                    <strong>{event.startWorldDateLabel}</strong>\n                    {event.endWorldDateLabel ? ` – ${event.endWorldDateLabel}` : ''}\n                    {' · '}\n                    {event.title}\n                    {' · '}\n                    {event.entityIds.length} linked {event.entityIds.length === 1 ? 'entity' : 'entities'}\n                  </li>\n                ))}\n              </ol>\n            ) : (\n              <p>No historical events yet.</p>\n            )}\n          </>\n        ) : (\n          <p>Reset the deterministic fixture to begin.</p>\n        )}\n      </section>\n\n      <section>\n        <h2>Real service actions</h2>\n        <button\n          type=\"button\"\n          disabled={isBusy || !state}\n          onClick={() => void act('create-point', 'MEMBER')}\n        >\n          Threadwalker: create point event\n        </button>\n        <button\n          type=\"button\"\n          disabled={isBusy || !state}\n          onClick={() => void act('create-duration', 'MEMBER')}\n        >\n          Threadwalker: create duration event\n        </button>\n        <button\n          type=\"button\"\n          disabled={isBusy || !state}\n          onClick={() => void act('create-invalid-duration', 'MEMBER')}\n        >\n          Try end-before-start\n        </button>\n        <button\n          type=\"button\"\n          disabled={isBusy || !state}\n          onClick={() => void act('create-point', 'VIEWER')}\n        >\n          Threadwatcher: try to create event\n        </button>\n      </section>\n\n      <ScenarioResultPanels result={result} />\n    </main>\n  )\n}\n""")
          PY

      - name: Format repository
        run: npm run format

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Validate repository
        run: npm run validate

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/finish-issue-113.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate World timeline across MVP UI"
          git push origin HEAD:feat/issue-113-world-events-timeline
